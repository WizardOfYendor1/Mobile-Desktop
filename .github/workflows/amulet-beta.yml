name: Publish Amulet Beta Builds

# Kept only on origin/automation/androidtv-beta. Trigger with either:
#   beta-build: feature/name | androidtv,windows
#   beta-snapshot | androidtv
# `all` selects every supported platform. `tvos` is deliberately unavailable
# until its signing and approval model is designed.
on:
  push:
    branches: [automation/androidtv-beta]

permissions:
  contents: write

concurrency:
  group: amulet-beta-publish
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.request.outputs.publish }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.sha }}
      android: ${{ steps.request.outputs.android }}
      androidtv: ${{ steps.request.outputs.androidtv }}
      ios: ${{ steps.request.outputs.ios }}
      macos: ${{ steps.request.outputs.macos }}
      windows: ${{ steps.request.outputs.windows }}
      windows_arm64: ${{ steps.request.outputs.windows_arm64 }}
      linux: ${{ steps.request.outputs.linux }}
    steps:
      - id: request
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          request="$MESSAGE"
          if [[ "$request" == beta-snapshot* ]]; then
            source_ref='beta/androidtv-snapshot'
            suffix="${request#beta-snapshot}"
          elif [[ "$request" == beta-build:\ * ]]; then
            body="${request#beta-build: }"
            raw_source_ref="${body%% | *}"
            suffix="${body#"$raw_source_ref"}"
            source_ref="${raw_source_ref#origin/}"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$source_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo 'Invalid source branch name.' >&2
            exit 1
          fi
          targets='androidtv'
          if [[ "$suffix" == ' | '* ]]; then targets="${suffix# | }"; fi
          if ! [[ "$targets" =~ ^(all|android|androidtv|ios|macos|windows|windows_arm64|linux|tvos)(,(all|android|androidtv|ios|macos|windows|windows_arm64|linux|tvos))*$ ]]; then
            echo 'Invalid targets. Use comma-separated android,androidtv,ios,macos,windows,windows_arm64,linux,all.' >&2
            exit 1
          fi
          if [[ ",$targets," == *,tvos,* ]]; then
            echo 'tvOS beta publishing is intentionally not configured yet.' >&2
            exit 1
          fi
          want() { [[ ",$targets," == *,all,* || ",$targets," == *,$1,* ]]; }
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          for platform in android androidtv ios macos windows windows_arm64 linux; do
            if want "$platform"; then echo "$platform=true" >> "$GITHUB_OUTPUT"; else echo "$platform=false" >> "$GITHUB_OUTPUT"; fi
          done

      - if: steps.request.outputs.publish == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: WizardOfYendor1/Moonfin-Client-Core
          ref: ${{ steps.request.outputs.source_ref }}
          persist-credentials: false
      - if: steps.request.outputs.publish == 'true'
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true, pub-cache: true }
      - name: Cache Android Gradle and CMake build state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/.cxx
          key: amulet-android-native-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/CMakeLists.txt', 'android/app/src/main/cpp/**', 'native/**', 'pubspec.lock') }}
          restore-keys: |
            amulet-android-native-${{ runner.os }}-
      - run: |
          flutter pub get
          flutter build apk --release --flavor mobile-beta --target-platform android-arm64 --dart-define=DISTRIBUTION_CHANNEL=amulet_android_beta
          mkdir amulet-assets
          cp build/app/outputs/flutter-apk/app-mobile-beta-release.apk "amulet-assets/Amulet_Android_Beta_${{ needs.prepare.outputs.source_sha }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: amulet-android, path: amulet-assets, if-no-files-found: error }

  androidtv:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.androidtv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true, pub-cache: true }
      - name: Cache Android Gradle and CMake build state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/.cxx
          key: amulet-androidtv-native-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/CMakeLists.txt', 'android/app/src/main/cpp/**', 'native/**', 'pubspec.lock') }}
          restore-keys: |
            amulet-androidtv-native-${{ runner.os }}-
      - run: |
          flutter pub get
          flutter build apk --release --flavor androidTv-beta --target-platform android-arm64 --dart-define=MOONFIN_FORCE_TV=true --dart-define=DISTRIBUTION_CHANNEL=amulet_androidtv_beta
          mkdir amulet-assets
          cp build/app/outputs/flutter-apk/app-androidtv-beta-release.apk "amulet-assets/Moonfin_AndroidTV_Amulet_Beta_${{ needs.prepare.outputs.source_sha }}.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: amulet-androidtv, path: amulet-assets, if-no-files-found: error }

  ios:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true, pub-cache: true }
      - run: |
          flutter pub get
          chmod +x ios/game_host/fetch_cores.sh ios/game_host/wrap_frameworks.sh
          ./ios/game_host/fetch_cores.sh && ./ios/game_host/wrap_frameworks.sh
          flutter build ipa --release --no-codesign
          app=$(find build/ios/archive -type d -path '*/Products/Applications/*.app' | head -1)
          mkdir -p amulet-assets/Payload
          cp -R "$app" amulet-assets/Payload/
          (cd amulet-assets && zip -qry "Amulet_iOS_Beta_${{ needs.prepare.outputs.source_sha }}_unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: amulet-ios, path: amulet-assets, if-no-files-found: error }

  macos:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true, pub-cache: true }
      - run: |
          flutter pub get
          flutter build macos --release
          mkdir amulet-assets
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Moonfin.app "amulet-assets/Amulet_macOS_Beta_${{ needs.prepare.outputs.source_sha }}_unsigned.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: amulet-macos, path: amulet-assets, if-no-files-found: error }

  windows:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true, pub-cache: true }
      - shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          .\build-windows.ps1
          New-Item -ItemType Directory amulet-assets | Out-Null
          Get-ChildItem Moonfin_Windows_v*.exe | Copy-Item -Destination "amulet-assets\Amulet_Windows_Beta_${{ needs.prepare.outputs.source_sha }}.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: amulet-windows, path: amulet-assets, if-no-files-found: error }

  windows_arm64:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.windows_arm64 == 'true'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - shell: pwsh
        run: |
          git clone https://github.com/flutter/flutter.git --branch $env:FLUTTER_VERSION --depth 1 C:\flutter
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install innosetup -y --no-progress
          .\build-windows.ps1 -Architecture arm64
          New-Item -ItemType Directory amulet-assets | Out-Null
          Get-ChildItem Moonfin_WindowsARM64_v*.exe | Copy-Item -Destination "amulet-assets\Amulet_WindowsARM64_Beta_${{ needs.prepare.outputs.source_sha }}.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: amulet-windows-arm64, path: amulet-assets, if-no-files-found: error }

  linux:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { repository: WizardOfYendor1/Moonfin-Client-Core, ref: '${{ needs.prepare.outputs.source_sha }}', persist-credentials: false }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: matrix.arch == 'x64'
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true, pub-cache: true }
      - if: matrix.arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git --branch "$FLUTTER_VERSION" --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev libmpv-dev libsecret-1-dev libasound2-dev libarchive-dev rpm flatpak flatpak-builder libfuse2 zsync
          sudo snap install snapcraft --classic
          sudo snap wait system seed.loaded
          sudo snap list core22 >/dev/null 2>&1 || sudo snap install core22 --channel=latest/stable
          arch=$(uname -m); toolarch=$([[ "$arch" == x86_64 ]] && echo x86_64 || echo aarch64)
          sudo curl -fsSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${toolarch}.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool
          chmod +x build-linux.sh
          ./build-linux.sh all
          mkdir amulet-assets
          for f in Moonfin_*; do [ -f "$f" ] && cp "$f" "amulet-assets/Amulet_${f#Moonfin_}"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'amulet-linux-${{ matrix.arch }}', path: amulet-assets, if-no-files-found: error }

  release:
    needs: [prepare, android, androidtv, ios, macos, windows, windows_arm64, linux]
    if: >-
      always() && needs.prepare.outputs.publish == 'true' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.androidtv.result == 'success' || needs.androidtv.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.windows_arm64.result == 'success' || needs.windows_arm64.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: amulet-*, path: release-assets, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          printf 'Source: WizardOfYendor1/Moonfin-Client-Core@%s\n' "$SOURCE_SHA" > BUILD_SOURCE.txt
          tag="amulet-beta-${SOURCE_SHA:0:12}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Amulet Beta ${SOURCE_SHA:0:12}" --prerelease --notes "Amulet beta built from \`WizardOfYendor1/Moonfin-Client-Core@${SOURCE_SHA}\`."
          fi
          gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY" --clobber
